<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal de procesos — Grupo Opencars</title>
    <meta
      name="description"
      content="Índice de las herramientas y los instructivos de los procesos contables del equipo de Grupo Opencars."
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/portal.css" />
  </head>
  <body>
    <header class="marca">
      <div class="hoja">
        <span class="marca-nombre">Grupo Opencars</span>
        <span class="marca-area">Contabilidad</span>
        <div class="marca-acciones">
          <a class="boton-linea" href="sumar-proceso.html">Sumar un proceso</a>
        </div>
      </div>
    </header>

    <main>
      <div class="hoja indice">
        <h1>Portal de procesos</h1>
        <p class="indice-estado" id="estado-portal">
          Cargando el registro de procesos…
        </p>

        <div class="controles">
          <div class="buscador">
            <label class="oculto-visual" for="buscar">
              Buscar un proceso o su instructivo
            </label>
            <input
              id="buscar"
              type="search"
              placeholder="Buscar proceso, cuenta, empresa…"
              autocomplete="off"
              spellcheck="false"
            />
            <p class="pista">
              <kbd>/</kbd> para buscar, <kbd>Enter</kbd> abre el primero,
              <kbd>↓</kbd> recorre las fichas.
            </p>
          </div>

          <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría"></div>
        </div>
      </div>

      <div class="hoja">
        <p class="oculto-visual" id="resultado" role="status"></p>
        <ul class="fichas" id="fichas">
          <noscript>
            <li class="vacio">
              <h2>El portal necesita JavaScript</h2>
              <p>
                La portada arma las fichas leyendo <code>registro.js</code>. Si tu
                navegador lo tiene desactivado, entrá a las herramientas y los
                instructivos directamente por la carpeta
                <code>procesos/</code>.
              </p>
            </li>
          </noscript>
        </ul>
      </div>
    </main>

    <footer class="pie">
      <div class="hoja">
        <p>
          Empresas del grupo: <strong>FOR</strong> Fortecar,
          <strong>GRA</strong> Granville, <strong>PAM</strong> Automotores
          Pampeanos (Pampawagen).
        </p>
        <p>
          ¿Armaste un proceso propio?
          <a href="sumar-proceso.html">Sumalo al portal</a>.
        </p>
      </div>
    </footer>

    <script src="registro.js"></script>
    <script src="assets/iconos.js"></script>
    <script src="assets/portal.js"></script>
  </body>
</html>
