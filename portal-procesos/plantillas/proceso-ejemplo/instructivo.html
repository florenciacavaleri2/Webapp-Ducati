         dentro del texto, porque corta el bloque.
         ================================================================== -->
    <script type="text/markdown">
# [Nombre del proceso]

**Autor:** [Nombre y apellido]
**Última actualización:** [DD/MM/AAAA]
**Categoría:** [Gastos / Stock / Reportes / Otro]
**Frecuencia:** [Mensual / Semanal / A demanda]
**Empresas:** [Fortecar / Granville / Automotores Pampeanos]

## Objetivo

[Qué resuelve este proceso, en una o dos líneas. Escribilo para alguien que
nunca lo corrió: qué entra, qué sale y para qué sirve.]

## Antes de empezar

- [Archivos o datos necesarios. Ejemplo: exportación de PowerBI del mes,
  extracto bancario en CSV, mayor de la cuenta.]
- [Requisitos previos. Ejemplo: el mes tiene que estar cerrado, la conciliación
  bancaria ya hecha.]

## Paso a paso

1. [Primer paso. Uno por acción, en el orden en que se hacen.]
2. [Segundo paso.]
3. [Tercer paso.]

## Resultado esperado

[Qué tenés que tener al terminar. Ejemplo: un Excel con los asientos listos
para cargar, o una diferencia en cero entre los dos reportes.]

## Notas y casos especiales

- [Errores comunes y cómo se resuelven.]
- [Excepciones: qué hacer cuando un dato no aparece o no cuadra.]

> Por relevar: borrá esta cita cuando el instructivo esté completo. Todo lo que
> quede por confirmar dejalo en una cita como esta: se pinta en ámbar y se ve de
> lejos, así nadie corre el proceso creyendo que el dato está verificado.
