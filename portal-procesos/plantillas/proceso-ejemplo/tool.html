<!doctype html>
<!--
  ============================================================================
  PLANTILLA DE HERRAMIENTA — Portal de procesos, Grupo Opencars

  Un solo archivo, sin dependencias: se abre con doble clic, funciona sin
  internet y los datos nunca salen de la máquina (no hay ninguna llamada de
  red en todo el archivo).

  CÓMO USARLA
  1. Copiá la carpeta plantillas/proceso-ejemplo a procesos/tu-proceso.
  2. Cambiá el título de acá abajo y el nombre en el encabezado.
  3. Escribí tu lógica donde dice "ACÁ VA TU LÓGICA".

  QUÉ NO HACER
  - Rutas a tu disco (C:\Users\...): el resto del equipo no las tiene.
  - Librerías por CDN: el portal tiene que andar sin internet.
  - Datos reales de la empresa dentro del archivo: se cargan al usarlo.
  ============================================================================
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nombre del proceso — Herramienta</title>
    <style>
      :root {
        --papel: #f2f4f3;
        --tinta: #16222e;
        --tinta-media: #55636e;
        --regla: #d4dad8;
        --sello: #0f5c4a;
        --sans: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        --datos: Consolas, ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--papel);
        color: var(--tinta);
        font-family: var(--sans);
        line-height: 1.5;
      }
      header {
        background: #fff;
        border-bottom: 3px solid var(--sello);
        padding: 16px 24px;
      }
      h1 {
        font-family: Cambria, Georgia, serif;
        font-size: 22px;
        font-weight: 400;
        margin: 0;
      }
      header p { margin: 4px 0 0; color: var(--tinta-media); font-size: 14px; }
      main { max-width: 1100px; margin: 24px auto 48px; padding: 0 24px; }
      section {
        background: #fff;
        border: 1px solid var(--regla);
        border-radius: 2px;
        padding: 20px;
        margin-bottom: 16px;
      }
      h2 {
        font-family: Cambria, Georgia, serif;
        font-size: 17px;
        font-weight: 400;
        margin: 0 0 12px;
      }
      .zona {
        border: 1px dashed #aab4b1;
        border-radius: 2px;
        padding: 24px;
        text-align: center;
        color: var(--tinta-media);
      }
      .zona.encima { border-color: var(--sello); background: #e7efec; }
      button {
        font: inherit;
        height: 40px;
        padding: 0 16px;
        border-radius: 2px;
        cursor: pointer;
        background: var(--sello);
        color: #fff;
        border: 1px solid var(--sello);
      }
      button.linea { background: #fff; color: var(--tinta); border-color: #aab4b1; }
      button:disabled { background: var(--regla); border-color: var(--regla); color: var(--tinta-media); cursor: default; }
      .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      .resumen { display: flex; gap: 24px; flex-wrap: wrap; margin: 0 0 12px; padding: 0; list-style: none; }
      .resumen li { font-size: 14px; color: var(--tinta-media); }
      .resumen strong { display: block; font-size: 20px; color: var(--tinta); font-family: var(--datos); }
      .tabla { overflow: auto; max-height: 460px; border: 1px solid var(--regla); }
      table { border-collapse: collapse; font-size: 13px; width: 100%; }
      th, td { border-bottom: 1px solid var(--regla); padding: 5px 10px; text-align: left; white-space: nowrap; }
      th { position: sticky; top: 0; background: var(--papel); font-weight: 600; }
      td.numero { font-family: var(--datos); text-align: right; }
      .nota { font-size: 13px; color: var(--tinta-media); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1>Nombre del proceso</h1>
      <p>Grupo Opencars · Contabilidad · los archivos no salen de esta máquina</p>
    </header>

    <main>
      <section>
        <h2>1. Cargá el archivo</h2>
        <div class="zona" id="zona">
          <p>Arrastrá acá el CSV exportado, o</p>
          <input type="file" id="archivo" accept=".csv,.txt,.tsv" />
        </div>
        <p class="nota">
          Acepta CSV separado por coma, punto y coma o tabulación. Para un Excel,
          guardalo antes como CSV.
        </p>
      </section>

      <section id="resultado" hidden>
        <h2>2. Resultado</h2>
        <ul class="resumen">
          <li>Filas<strong id="conteo-filas">0</strong></li>
          <li>Columnas<strong id="conteo-columnas">0</strong></li>
          <li>Archivo<strong id="nombre-archivo">—</strong></li>
        </ul>
        <div class="tabla" id="tabla"></div>
        <div class="acciones">
          <button type="button" id="copiar">Copiar para Excel</button>
          <button type="button" class="linea" id="limpiar">Empezar de nuevo</button>
        </div>
        <p class="nota" id="aviso" aria-live="polite"></p>
      </section>
    </main>

    <script>
      (function () {
        'use strict';

        var FILAS_VISIBLES = 100;
        var datos = { encabezado: [], filas: [] };

        /* --- Lectura de CSV --------------------------------------------------
           Parser propio: respeta comillas dobles y detecta el separador. El
           Excel en español exporta con punto y coma, no con coma. */

        function detectarSeparador(primeraLinea) {
          var candidatos = [';', ',', '\t', '|'];
          var mejor = ';';
          var maximo = -1;
          candidatos.forEach(function (separador) {
            var cuantos = primeraLinea.split(separador).length;
            if (cuantos > maximo) {
              maximo = cuantos;
              mejor = separador;
            }
          });
          return mejor;
        }

        function leerCSV(texto) {
          texto = texto.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
          var separador = detectarSeparador(texto.split('\n')[0] || '');
          var filas = [];
          var fila = [];
          var celda = '';
          var entreComillas = false;

          for (var i = 0; i < texto.length; i++) {
            var caracter = texto[i];
            if (entreComillas) {
              if (caracter === '"') {
                if (texto[i + 1] === '"') { celda += '"'; i++; }
                else entreComillas = false;
              } else celda += caracter;
              continue;
            }
            if (caracter === '"') { entreComillas = true; continue; }
            if (caracter === separador) { fila.push(celda.trim()); celda = ''; continue; }
            if (caracter === '\n') {
              fila.push(celda.trim());
              celda = '';
              if (fila.some(function (valor) { return valor !== ''; })) filas.push(fila);
              fila = [];
              continue;
            }
            celda += caracter;
          }
          fila.push(celda.trim());
          if (fila.some(function (valor) { return valor !== ''; })) filas.push(fila);

          return {
            encabezado: filas.shift() || [],
            filas: filas,
          };
        }

        /** Convierte "1.234,56" (formato argentino) a número. */
        function aNumero(valor) {
          var limpio = String(valor).replace(/\s|\$/g, '').replace(/\./g, '').replace(',', '.');
          var numero = parseFloat(limpio);
          return isNaN(numero) ? null : numero;
        }

        /* --- ACÁ VA TU LÓGICA -----------------------------------------------
           `datos.encabezado` es un array con los nombres de columna y
           `datos.filas` un array de arrays con los valores. Agrupá, cruzá
           Debe/Haber, buscá diferencias: lo que haga tu proceso.

           Devolvé lo que quieras mostrar en la tabla: { encabezado, filas }. */

        function procesar(entrada) {
          return entrada; // por defecto, muestra el archivo tal cual
        }

        /* --- Pantalla -------------------------------------------------------- */

        var zona = document.getElementById('zona');
        var entrada = document.getElementById('archivo');
        var seccion = document.getElementById('resultado');
        var aviso = document.getElementById('aviso');

        function pintar(salida, nombre) {
          document.getElementById('conteo-filas').textContent = salida.filas.length;
          document.getElementById('conteo-columnas').textContent = salida.encabezado.length;
          document.getElementById('nombre-archivo').textContent = nombre;

          var visibles = salida.filas.slice(0, FILAS_VISIBLES);
          var html =
            '<table><thead><tr>' +
            salida.encabezado.map(function (titulo) { return '<th>' + escapar(titulo) + '</th>'; }).join('') +
            '</tr></thead><tbody>' +
            visibles
              .map(function (fila) {
                return (
                  '<tr>' +
                  salida.encabezado
                    .map(function (_, columna) {
                      var valor = fila[columna] == null ? '' : fila[columna];
                      var clase = aNumero(valor) === null ? '' : ' class="numero"';
                      return '<td' + clase + '>' + escapar(valor) + '</td>';
                    })
                    .join('') +
                  '</tr>'
                );
              })
              .join('') +
            '</tbody></table>';

          document.getElementById('tabla').innerHTML = html;
          seccion.hidden = false;
          aviso.textContent =
            salida.filas.length > FILAS_VISIBLES
              ? 'Se muestran las primeras ' + FILAS_VISIBLES + ' filas. "Copiar para Excel" copia todas.'
              : '';
          datos = salida;
        }

        function escapar(texto) {
          return String(texto == null ? '' : texto)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        }

        function abrir(archivo) {
          if (!archivo) return;
          var lector = new FileReader();
          lector.onload = function () {
            try {
              pintar(procesar(leerCSV(String(lector.result))), archivo.name);
            } catch (error) {
              seccion.hidden = false;
              aviso.textContent = 'No se pudo leer el archivo: ' + error.message;
            }
          };
          // Windows-1252 cubre los CSV que salen de Excel en español.
          lector.readAsText(archivo, 'windows-1252');
        }

        entrada.addEventListener('change', function () { abrir(entrada.files[0]); });

        ['dragenter', 'dragover'].forEach(function (evento) {
          zona.addEventListener(evento, function (e) {
            e.preventDefault();
            zona.classList.add('encima');
          });
        });
        ['dragleave', 'drop'].forEach(function (evento) {
          zona.addEventListener(evento, function (e) {
            e.preventDefault();
            zona.classList.remove('encima');
          });
        });
        zona.addEventListener('drop', function (e) {
          abrir(e.dataTransfer.files[0]);
        });

        document.getElementById('copiar').addEventListener('click', function () {
          var tsv = [datos.encabezado]
            .concat(datos.filas)
            .map(function (fila) { return fila.join('\t'); })
            .join('\n');
          var area = document.createElement('textarea');
          area.value = tsv;
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand('copy');
            aviso.textContent = 'Copiado: pegalo en Excel con Ctrl+V.';
          } catch (error) {
            aviso.textContent = 'No se pudo copiar automáticamente.';
          }
          document.body.removeChild(area);
        });

        document.getElementById('limpiar').addEventListener('click', function () {
          entrada.value = '';
          seccion.hidden = true;
          aviso.textContent = '';
          datos = { encabezado: [], filas: [] };
        });
      })();
    </script>
  </body>
</html>
