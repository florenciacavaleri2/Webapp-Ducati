# Gastos indirectos

**Autor:** Florencia Cavaleri
**Última actualización:** 22/09/2026
**Categoría:** Gastos
**Frecuencia:** Mensual
**Empresas:** Fortecar, Granville, Automotores Pampeanos

## Objetivo

Comparar mes a mes los gastos indirectos de las tres empresas contra el plan de
cuentas definido, para ver los desvíos y las cuentas que aparecen fuera del
plan.

## Antes de empezar

- El mayor de gastos del mes de cada empresa.
- El plan de cuentas vigente: es la referencia contra la que se compara.
- El mes anterior ya procesado, porque la comparación es contra el mes previo.

> Por relevar: dónde está el plan de cuentas que usa la herramienta (si viene
> dentro del HTML o se carga aparte) y quién lo mantiene actualizado.

## Paso a paso

1. Exportá el mayor de gastos del mes de cada empresa.
2. Abrí la herramienta desde el portal.
3. Cargá los archivos de las tres empresas.
4. Revisá la comparación contra el mes anterior: desvíos grandes y cuentas
   nuevas.
5. Revisá las cuentas que quedaron fuera del plan y decidí qué hacer con cada
   una.

> Por relevar: reemplazá estos pasos por los reales cuando corras el proceso,
> con los nombres de columna que espera cada archivo.

## Resultado esperado

Un comparativo de gastos indirectos por empresa y por cuenta contra el mes
anterior, con los desvíos identificados y las cuentas fuera del plan marcadas.

## Notas y casos especiales

> Por relevar: qué se hace con una cuenta que no está en el plan, y qué desvío
> se considera aceptable antes de tener que explicarlo.

## Qué falta para cerrar este instructivo

- [ ] Subir el HTML de la herramienta a la carpeta del proceso
- [ ] Documentar de dónde sale el plan de cuentas y cómo se actualiza
- [ ] Definir el umbral de desvío que se revisa
- [ ] Detallar el paso a paso real
