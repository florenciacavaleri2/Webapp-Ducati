# Gastos Mercado Libre / MP Propio

**Autor:** Florencia Cavaleri
**Última actualización:** 22/09/2026
**Categoría:** Gastos
**Frecuencia:** Mensual
**Empresas:** Fortecar

## Objetivo

Automatizar la conciliación mensual de la cuenta **MP Propio** de Fortecar y
preparar los asientos contables del mes, en lugar de armarlos a mano desde el
reporte de Mercado Pago.

## Antes de empezar

- El reporte de liberaciones y movimientos del mes de Mercado Pago.
- El mayor de la cuenta MP Propio del mismo período.
- El mes cerrado en Mercado Pago: un movimiento que entra después obliga a
  rehacer el asiento.

> Por relevar: qué reporte exacto se descarga de Mercado Pago (nombre y
> período) y si hace falta también el de Mercado Libre por separado.

## Paso a paso

1. Descargá el reporte del mes desde Mercado Pago.
2. Exportá el mayor de la cuenta MP Propio.
3. Abrí la herramienta desde el portal y cargá los dos archivos.
4. Revisá las diferencias entre el reporte y el mayor.
5. Generá los asientos y copialos a la planilla de carga.

> Por relevar: confirmá el orden real de los pasos y qué hace la herramienta
> automáticamente frente a lo que hay que revisar a mano.

## Resultado esperado

Los asientos contables del mes de la cuenta MP Propio, listos para cargar, y la
conciliación entre el reporte de Mercado Pago y el mayor con la diferencia
explicada.

## Notas y casos especiales

> Por relevar: comisiones, retenciones e impuestos que Mercado Pago informa
> aparte, y cómo se imputa cada uno.

## Qué falta para cerrar este instructivo

- [ ] Subir el HTML de la herramienta a la carpeta del proceso
- [ ] Nombrar los reportes exactos de Mercado Pago que se usan
- [ ] Documentar el tratamiento de comisiones y retenciones
- [ ] Detallar el paso a paso real
