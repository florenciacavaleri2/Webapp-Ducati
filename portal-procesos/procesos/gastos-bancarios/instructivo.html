# Gastos bancarios

**Autor:** Florencia Cavaleri
**Última actualización:** 22/09/2026
**Categoría:** Gastos
**Frecuencia:** Mensual
**Empresas:** Fortecar, Granville, Automotores Pampeanos

## Objetivo

Procesar los gastos de todas las cuentas bancarias de las tres empresas y verlos
juntos en una sola pantalla, en lugar de revisar banco por banco. Sirve para
detectar comisiones, impuestos y débitos que no corresponden antes de cerrar el
mes.

## Antes de empezar

- Extractos del mes de cada cuenta bancaria, exportados en CSV.
- Saber qué cuentas entran: si falta un banco, el total del mes queda corto y no
  hay nada en la pantalla que lo avise.

> Por relevar: de qué bancos se descargan los extractos, en qué formato los da
> cada uno, y si la herramienta espera un archivo por cuenta o uno consolidado.

## Paso a paso

1. Descargá los extractos del mes de todas las cuentas de las tres empresas.
2. Abrí la herramienta desde el portal, con el botón **Abrir** de la ficha.
3. Cargá los archivos descargados.
4. Revisá el detalle por cuenta y por concepto.
5. Copiá el resultado a Excel para dejarlo en la carpeta del cierre.

> Por relevar: los pasos de arriba son el recorrido general. Al correr el
> proceso el mes que viene, anotá lo que la herramienta pide de verdad —
> nombres de columna, filtros, qué se descarta— y reemplazá esta lista.

## Resultado esperado

El total de gastos bancarios del mes, abierto por empresa, cuenta y concepto,
listo para pegar en la planilla del cierre.

## Notas y casos especiales

> Por relevar: errores comunes (movimientos duplicados, conceptos nuevos que no
> están mapeados, extractos con otra codificación) y cómo se resuelven.

## Qué falta para cerrar este instructivo

- [ ] Subir el HTML de la herramienta a la carpeta del proceso
- [ ] Listar las cuentas bancarias que entran, por empresa
- [ ] Detallar el paso a paso real con los nombres de los archivos
- [ ] Anotar los casos especiales del último cierre
