# Stock VO

**Autor:** Florencia Cavaleri
**Última actualización:** 22/09/2026
**Categoría:** Stock
**Frecuencia:** Mensual
**Empresas:** Fortecar, Granville, Automotores Pampeanos
**Cuenta:** 115201

## Objetivo

Conciliar el stock de vehículos usados de la cuenta **115201** cruzando Debe y
Haber por patente. Lo que queda sin cruzar es una unidad que entró y no salió
—o al revés—, y ahí está la diferencia del mes.

## Antes de empezar

- El mayor de la cuenta 115201 del mes, por empresa, con la patente en el
  detalle del movimiento.
- El listado de stock físico de usados para contrastar lo que quedó abierto.

> Por relevar: de qué sistema sale el mayor y en qué columna viene la patente,
> porque el cruce depende de eso.

## Paso a paso

1. Exportá el mayor de la cuenta 115201 del mes de cada empresa.
2. Abrí la herramienta desde el portal y cargá el archivo.
3. Revisá las patentes que cruzan Debe contra Haber: esas quedan cerradas.
4. Revisá las que quedan sin par y buscá el motivo (unidad en stock, movimiento
   sin patente, patente mal escrita).
5. Contrastá las abiertas contra el stock físico.

> Por relevar: el paso a paso real, y qué tolerancia de diferencia se acepta
> antes de escalar.

## Resultado esperado

El listado de patentes con Debe y Haber cruzados, y el detalle de las que quedan
abiertas: cada una tiene que corresponder a una unidad que sigue en stock.

## Notas y casos especiales

- Una patente escrita distinto en el Debe y en el Haber no cruza y aparece dos
  veces como diferencia. Es el error más común del proceso.

> Por relevar: qué se hace con los movimientos que no tienen patente en el
> detalle, y cómo se tratan las unidades que cambian de empresa.

## Qué falta para cerrar este instructivo

- [ ] Subir el HTML de la herramienta a la carpeta del proceso
- [ ] Documentar de dónde sale el mayor y qué columna trae la patente
- [ ] Definir el tratamiento de los movimientos sin patente
- [ ] Detallar el paso a paso real
