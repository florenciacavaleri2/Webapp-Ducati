# Rentabilidad vs. Contabilidad

**Autor:** Florencia Cavaleri
**Última actualización:** 22/09/2026
**Categoría:** Reportes
**Frecuencia:** Mensual

## Objetivo

Conciliar el reporte de rentabilidad contra los libros contables del mes. Las
dos fuentes tienen que contar la misma historia: cuando no coinciden, este
proceso muestra dónde está la diferencia.

## Antes de empezar

- El reporte de rentabilidad del mes.
- Los libros contables del mismo período, ya cerrados.
- Las dos fuentes recortadas al mismo mes y a la misma empresa: comparar
  períodos distintos da una diferencia que no existe.

> Por relevar: de qué sistema sale el reporte de rentabilidad y con qué
> criterio se recorta el período.

## Paso a paso

1. Exportá el reporte de rentabilidad del mes.
2. Exportá el mayor contable del mismo período.
3. Abrí la herramienta desde el portal y cargá los dos archivos.
4. Revisá las diferencias que muestra, una por una.
5. Documentá cada diferencia que queda: qué la explica y si se corrige o se
   deja anotada.

> Por relevar: el paso a paso real y qué comparación hace la herramienta
> exactamente (por cuenta, por unidad de negocio, por operación).

## Resultado esperado

La diferencia entre rentabilidad y contabilidad explicada línea por línea, y la
lista de ajustes a hacer si corresponde.

## Notas y casos especiales

> Por relevar: diferencias que se repiten todos los meses por criterio (no son
> errores) y cómo se registran para no volver a investigarlas.

## Qué falta para cerrar este instructivo

- [ ] Subir el HTML de la herramienta a la carpeta del proceso
- [ ] Confirmar qué empresas cubre el proceso
- [ ] Nombrar el reporte de rentabilidad y de dónde se descarga
- [ ] Listar las diferencias recurrentes que ya están explicadas
